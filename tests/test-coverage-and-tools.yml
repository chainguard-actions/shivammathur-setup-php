name: Test PHP setup with coverage and tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version: '8.2'
          coverage: 'none'
          tools: 'composer'
      - name: Assert php-version output
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output is $ACTUAL"
      - name: Assert composer is installed
        run: |
          composer --version
          echo "PASS: composer is installed"
