name: Test PHP setup with extensions and ini-values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version: '8.1'
          extensions: 'mbstring, curl'
          ini-values: 'memory_limit=256M'
      - name: Assert php-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output = $ACTUAL"
      - name: Assert PHP is installed
        run: |
          php --version
          echo "PASS: PHP is installed"
      - name: Assert mbstring extension is loaded
        run: |
          php -m | grep -i mbstring
          echo "PASS: mbstring extension is loaded"
      - name: Assert memory_limit ini value
        run: |
          MEMORY=$(php -r "echo ini_get('memory_limit');")
          echo "memory_limit: $MEMORY"
          if [ "$MEMORY" != "256M" ]; then
            echo "FAIL: expected memory_limit=256M, got $MEMORY"
            exit 1
          fi
          echo "PASS: memory_limit is 256M"
