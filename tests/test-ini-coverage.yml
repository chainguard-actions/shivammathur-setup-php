name: Test PHP setup with ini-values and coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version: '8.1'
          ini-values: 'memory_limit=256M, max_execution_time=30'
          coverage: 'none'
      - name: Assert php-version output
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version=$ACTUAL"
      - name: Assert PHP is installed
        run: |
          php --version
          echo "PASS: PHP is installed"
