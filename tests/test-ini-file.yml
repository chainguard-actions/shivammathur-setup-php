name: Test PHP setup with development ini-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-php
        uses: .
        with:
          php-version: '8.2'
          ini-file: 'development'
      - name: Assert php-version output is set
        env:
          PHP_VERSION_OUTPUT: ${{ steps.setup-php.outputs.php-version }}
        run: |
          echo "php-version output: $PHP_VERSION_OUTPUT"
          if [ -z "$PHP_VERSION_OUTPUT" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output is '$PHP_VERSION_OUTPUT'"
      - name: Assert PHP is functional with development ini
        run: |
          php --version
          INSTALLED=$(php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;")
          echo "Installed PHP version: $INSTALLED"
          if [[ "$INSTALLED" != "8.2" ]]; then
            echo "FAIL: expected PHP 8.2 but got $INSTALLED"
            exit 1
          fi
          # In development ini, display_errors should be On
          DISPLAY_ERRORS=$(php -r "echo ini_get('display_errors');")
          echo "display_errors: $DISPLAY_ERRORS"
          echo "PASS: PHP is functional with development ini-file"
