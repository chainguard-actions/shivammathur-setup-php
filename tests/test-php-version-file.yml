name: Test PHP setup with php-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-php
        uses: .
        with:
          php-version-file: 'actions/hardened/shivammathur--setup-php/2.37.2/tests/fixtures/.php-version'
      - name: Assert php-version output is set
        env:
          ACTUAL: ${{ steps.setup-php.outputs.php-version }}
        run: |
          echo "actual php-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output is '$ACTUAL'"
      - name: Assert PHP version matches file
        run: |
          PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          echo "PHP version: $PHP_VER"
          if [ "$PHP_VER" != "8.3" ]; then
            echo "FAIL: expected PHP 8.3 (from version file), got $PHP_VER"
            exit 1
          fi
          echo "PASS"
