name: Test PHP setup with version file and tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .php-version file
        run: echo "8.1" > .php-version
      - id: action
        uses: .
        with:
          php-version-file: '.php-version'
          tools: 'composer'
      - name: Assert php-version output
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected php-version output to be non-empty"
            exit 1
          fi
          echo "PASS: php-version=$ACTUAL"
      - name: Assert PHP is available
        run: |
          php --version
          echo "PASS: PHP is available"
      - name: Assert composer is available
        run: |
          composer --version
          echo "PASS: composer is available"
