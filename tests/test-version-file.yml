name: Test PHP setup with php-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version-file: 'actions/hardened/shivammathur--setup-php/2.37.1/tests/fixtures/.php-version'
      - name: Assert php-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output = $ACTUAL"
      - name: Assert PHP is installed
        run: |
          php --version
          echo "PASS: PHP is installed"
      - name: Assert PHP version starts with 8.3
        run: |
          VERSION=$(php -r "echo PHP_MAJOR_VERSION.'.'.PHP_MINOR_VERSION;")
          echo "PHP version: $VERSION"
          if [ "$VERSION" != "8.3" ]; then
            echo "FAIL: expected PHP 8.3, got $VERSION"
            exit 1
          fi
          echo "PASS: PHP version is 8.3"
