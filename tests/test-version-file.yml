name: Test PHP setup from version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .php-version file
        run: echo "8.3" > .php-version
      - id: action
        uses: .
        with:
          php-version-file: '.php-version'
      - name: Assert PHP is installed at version from file
        run: |
          php --version
          PHP_VER=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          echo "Detected PHP version: $PHP_VER"
          if [ "$PHP_VER" != "8.3" ]; then
            echo "FAIL: expected PHP 8.3 (from .php-version file), got $PHP_VER"
            exit 1
          fi
          echo "PASS: PHP version matches .php-version file"
      - name: Assert php-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.php-version }}
        run: |
          echo "actual php-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: php-version output is empty"
            exit 1
          fi
          echo "PASS: php-version output is '$ACTUAL'"
